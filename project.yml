name: iVidiBlocks
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: S769436W24
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iVidiBlocks:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: iVidiBlocks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itetris
        PRODUCT_NAME: iVidiBlocks
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iVidiBlocksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: iVidiBlocks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itetris.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  iVidiBlocks:
    build:
      targets:
        iVidiBlocks: all
        iVidiBlocksTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iVidiBlocksTests
