name: iTetris
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iTetris:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: iTetris
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.puzzle-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itetris
        PRODUCT_NAME: iTetris
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iTetrisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: iTetris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itetris.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  iTetris:
    build:
      targets:
        iTetris: all
        iTetrisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iTetrisTests
